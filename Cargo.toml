[package]
name = "token-ledger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline AI token ledger with read-only source collection"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
libc = "0.2"
leveldb-core = "=0.1.2"
crc32c = "0.6"
thiserror = "2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snap = "1"
tiny_http = "0.12"
url = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
